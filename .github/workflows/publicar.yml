name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar archivos publicos
        run: |
          mkdir -p _site
          cp index.html informe.pdf analisis.R _site/

      - name: Guardar sitio para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar PDF y explorador
        id: deployment
        uses: actions/deploy-pages@v4
