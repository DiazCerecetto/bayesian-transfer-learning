name: Compilar y publicar informe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar fuentes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - name: Instalar LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y latexmk texlive-xetex texlive-lang-spanish texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Regenerar resultados, tabla, figura y HTML
        run: Rscript analisis.R

      - name: Compilar el informe
        run: |
          mkdir -p build
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -outdir=build informe/informe.tex
          cp build/informe.pdf informe.pdf

      - name: Preparar archivos publicos
        run: |
          mkdir -p _site/resultados
          cp index.html informe.pdf analisis.R _site/
          cp resultados/sensibilidad-fuente.csv _site/resultados/

      - name: Guardar sitio para publicar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar PDF y explorador
        id: deployment
        uses: actions/deploy-pages@v4
